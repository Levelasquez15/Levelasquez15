<svg width="850" height="360" viewBox="0 0 850 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="limeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c5ff4a" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5ff4a" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.7" />
    </linearGradient>
    <pattern id="cyberGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#161b22" stroke-width="0.6" />
      <circle cx="20" cy="20" r="0.8" fill="#21262d" />
    </pattern>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap');
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .neon-glow {
      filter: drop-shadow(0 0 10px rgba(197, 255, 74, 0.45));
    }
  </style>

  <!-- Background Deck -->
  <rect width="850" height="360" rx="10" fill="#060606" />
  <rect width="850" height="360" rx="10" fill="url(#cyberGrid)" />
  <rect x="1" y="1" width="848" height="358" rx="9" fill="none" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Terminal Top Bar -->
  <rect x="1" y="1" width="848" height="38" rx="9" fill="#0d1117" />
  <line x1="1" y1="39" x2="849" y2="39" stroke="#21262d" stroke-width="1" />
  
  <!-- Terminal Control Dots -->
  <circle cx="22" cy="20" r="6" fill="#ff5f56" />
  <circle cx="42" cy="20" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="20" r="6" fill="#27c93f" />

  <!-- Top Bar Title &amp; Status -->
  <text x="88" y="24" class="mono" font-size="12" font-weight="500" fill="#8b949e">[ GITASCII // ENCRYPTED TELEMETRY DECK ]</text>
  <text x="690" y="24" class="mono" font-size="11" font-weight="600" fill="#c5ff4a">SYS.STATUS: OPERATIONAL &#x25CF;</text>

  <!-- Slant ASCII Banner -->
  <g class="neon-glow">
    <text x="32" y="80" class="mono" font-size="13" font-weight="700" fill="url(#limeCyan)" xml:space="preserve">    __    _______    __________    ___   _____ ____  __  _____________</text>
    <text x="32" y="96" class="mono" font-size="13" font-weight="700" fill="url(#limeCyan)" xml:space="preserve">   / /   / ____/ |  / / ____/ /   /   | / ___// __ \/ / / / ____/__  /</text>
    <text x="32" y="112" class="mono" font-size="13" font-weight="700" fill="url(#limeCyan)" xml:space="preserve">  / /   / __/  | | / / __/ / /   / /| | \__ \/ / / / / / / __/    / / </text>
    <text x="32" y="128" class="mono" font-size="13" font-weight="700" fill="url(#limeCyan)" xml:space="preserve"> / /___/ /___  | |/ / /___/ /___/ ___ |___/ / /_/ / /_/ / /___   / /__</text>
    <text x="32" y="144" class="mono" font-size="13" font-weight="700" fill="url(#limeCyan)" xml:space="preserve">/_____/_____/  |___/_____/_____/_/  |_/____/\___\_\____/_____/  /____/</text>
  </g>

  <!-- Editorial Subheader &amp; Identity -->
  <text x="34" y="180" class="sans" font-size="18" font-weight="700" fill="#f0f6fc">LEWIS VELÁSQUEZ WATTS</text>
  <text x="270" y="180" class="mono" font-size="12" font-weight="500" fill="#00f0ff">// AUTONOMOUS SYSTEMS ARCHITECT</text>
  <text x="34" y="204" class="sans" font-size="13" font-weight="400" fill="#8b949e">Estudiante de Ingeniería de Sistemas (Unicolombo) · Técnico en Sistemas · Cartagena, Colombia 🇨🇴</text>

  <!-- Horizontal Grid Divider -->
  <line x1="34" y1="222" x2="816" y2="222" stroke="#21262d" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Telemetry Parameters Matrix -->
  <!-- Col 1 -->
  <rect x="34" y="236" width="248" height="52" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
  <text x="46" y="255" class="mono" font-size="11" fill="#8b949e">PRIMARY FOCUS</text>
  <text x="46" y="274" class="mono" font-size="12" font-weight="700" fill="#c5ff4a">AI Vision &amp; Autonomous Agents</text>

  <!-- Col 2 -->
  <rect x="298" y="236" width="252" height="52" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
  <text x="310" y="255" class="mono" font-size="11" fill="#8b949e">CORE ARCHITECTURE</text>
  <text x="310" y="274" class="mono" font-size="12" font-weight="700" fill="#00f0ff">Hexagonal (Ports) &amp; DDD</text>

  <!-- Col 3 -->
  <rect x="566" y="236" width="250" height="52" rx="6" fill="#0d1117" stroke="#21262d" stroke-width="1" />
  <text x="578" y="255" class="mono" font-size="11" fill="#8b949e">DEPLOYMENT &amp; RUNTIME</text>
  <text x="578" y="274" class="mono" font-size="12" font-weight="700" fill="#a371f7">Docker · CUDA · Azure · Edge</text>

  <!-- Terminal Command Prompt Footer -->
  <rect x="34" y="302" width="782" height="38" rx="6" fill="#000000" stroke="#1b1f24" stroke-width="1" />
  <text x="48" y="326" class="mono" font-size="12" fill="#c5ff4a">$</text>
  <text x="66" y="326" class="mono" font-size="12" fill="#f0f6fc">sysctl --operator=levelasquez15 --protocols=[MCP,MediaPipe,FastAPI,PWA] --status=active</text>
</svg>
